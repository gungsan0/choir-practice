<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="app.name">울림 합창 연습실</title>
<meta name="description" data-i18n-content="app.desc" content="악보를 따라가며 파트별로 연습하는 합창 연습 앱">
<meta name="theme-color" content="#15181d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="top"><div class="inner"><div class="brand">
  <img src="logo-badge.png" width="46" height="46" alt="울림 어린이합창단" data-i18n-alt="logo.alt">
  <div><h1 data-i18n="app.name">울림 합창 연습실</h1><p data-i18n="app.tagline">악보를 따라가며 파트별로 연습하세요</p></div>
</div><button class="btn langbtn" type="button" data-lang-toggle>EN</button></div></div>

<div class="wrap">
  <div class="toolbar">
    <input class="search" id="q" type="search" placeholder="곡 검색" data-i18n-ph="q.ph" autocomplete="off">
    <a class="add" href="add.html" id="addbtn" data-i18n="add.btn" hidden>＋ 곡 추가</a>
  </div>
  <div class="list" id="list"></div>
  <div class="note" id="note"></div>
</div>

<script src="i18n.js"></script>
<script>
const T=I18N.t, E=I18N.esc;
const busy=new Map();                          // 삭제 진행 중인 곡(id → [문구 키, 값]) — 언어를 바꿔 목록을 다시 그려도 유지
const busyText=id=>{ const b=busy.get(id); return b?T(b[0],b[1]):T('del.btn'); };
const COLORS=["#e0483c","#1f9d55","#2f6fe0","#8b5cf6","#e08a1e","#0d9488","#d6336c","#4b5563"];
const fmt=s=>{ let m=Math.floor(s/60), r=Math.round(s%60); if(r===60){ m++; r=0; } return T('fmt.dur',{m,s:String(r).padStart(2,'0')}); };
let songs=[], cached=new Set();

/* 곡 추가·공개·삭제는 저장소 관리자만 — 실제 권한은 GitHub 토큰이 쥐고 있고(토큰 없이는
   GitHub이 거절합니다), 여기서는 그에 맞춰 관리용 버튼을 감춥니다. */
const isOwner=()=>{ try{ const c=JSON.parse(localStorage.getItem('gh')||'{}'); return !!(c.repo&&c.token); }catch(e){ return false; } };
const owner=isOwner();
document.getElementById('addbtn').hidden=!owner;

async function cachedIds(){
  if(!('caches' in window)) return new Set();
  try{
    const keys=await caches.keys(); const out=new Set();
    for(const k of keys){
      if(!k.startsWith('songs-')) continue;
      const c=await caches.open(k);
      for(const r of await c.keys()){
        const m=r.url.match(/songs\/([^/]+)\//); if(m) out.add(m[1]);
      }
    }
    return out;
  }catch(e){ return new Set(); }
}

function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const list=document.getElementById('list');
  const rows=songs.filter(s=>!q||(s.title+' '+(s.subtitle||'')+' '+(s.parts||[]).join(' ')).toLowerCase().includes(q));
  list.innerHTML='';
  if(!rows.length){
    list.innerHTML='<div class="empty">'+(songs.length ? T('empty.search') : (owner ? T('empty.owner') : T('empty.none')))+'</div>';
    return;
  }
  rows.forEach(s=>{
    const a=document.createElement('a');
    a.className='card'; a.href='player.html?song='+encodeURIComponent(s.id);
    const chips=(s.parts||[]).map((p,i)=>`<span class="chip" style="background:${COLORS[i%COLORS.length]}">${E(p)}</span>`).join('')
      +(s.accomp?`<span class="chip" style="background:#6b7280">🎹 ${E(I18N.data(s.accomp))}</span>`:'');
    a.innerHTML=`<h2>${E(s.title)}</h2>`+(s.subtitle?`<p class="sub">${E(I18N.data(s.subtitle))}</p>`:'')+
      `<div class="chips">${chips}
        ${s.local
          ? `<span class="scope only" title="${T('scope.only.tip')}">${T('scope.only')}</span>`
          : `<span class="scope pub" title="${T('scope.pub.tip')}">${T('scope.pub')}</span>`}
        ${!s.local&&cached.has(s.id)?`<span class="saved">${T('saved.offline')}</span>`:''}
        <span class="meta">${s.measures?T('bars',{n:s.measures})+' · ':''}${s.pages?T('pages',{n:s.pages})+' · ':''}${s.duration?fmt(s.duration):''}</span>
        ${owner?`<button class="del" data-fix="${E(s.id)}" title="${T('fix.tip')}">${T('fix.btn')}</button>`:''}
        ${owner||s.local?`<button class="del danger" data-del="${E(s.id)}"${busy.has(s.id)?' disabled':''} title="${s.local?T('del.tip.local'):T('del.tip.pub')}">${E(busyText(s.id))}</button>`:''}
      </div>`;
    list.appendChild(a);
  });
}

let ready=false;
function paintNote(){
  document.getElementById('note').innerHTML =
    (owner ? T('note.owner') : T('note.guest')) + T('note.common') +
    ' <span style="opacity:.7">'+T('note.version',{v:'2026.10.08-b'})+'</span> · <a href="#" id="hard" style="text-decoration:underline">'+T('note.reload')+'</a>' +
    (owner ? '' : ' · <a href="add.html" style="opacity:.55">'+T('note.admin')+'</a>');
  document.getElementById('hard').onclick = async e => {
    e.preventDefault();
    try {
      const rs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(r => r.unregister()));
      const keys = await caches.keys();
      await Promise.all(keys.filter(k => k.startsWith('shell-')).map(k => caches.delete(k)));
    } catch (err) {}
    location.reload(true);
  };
}
I18N.onChange(()=>{ if(ready){ render(); paintNote(); } });
(async ()=>{
  try{
    const r=await fetch('songs/index.json',{cache:'no-cache'});
    songs=(await r.json()).songs||[];
  }catch(e){ songs=[]; }
  try{
    const local=JSON.parse(localStorage.getItem('localSongs')||'[]');
    const ids=new Set(songs.map(s=>s.id));
    songs=songs.concat(local.filter(s=>!ids.has(s.id)));
    songs.sort((a,b)=>a.title.localeCompare(b.title));
  }catch(e){}
  cached=await cachedIds();
  render();
  ready=true;
  paintNote();
})();
document.getElementById('q').addEventListener('input',render);
/* ── 곡 삭제 / 다시 만들기 ─────────────────────────── */
const ghCfg = () => { try{ return JSON.parse(localStorage.getItem('gh')||'{}'); }catch(e){ return {}; } };
async function ghApi(path, opt={}){
  const c=ghCfg();
  const r=await fetch('https://api.github.com/repos/'+c.repo+path, {...opt,
    headers:{Authorization:'Bearer '+c.token, Accept:'application/vnd.github+json', ...(opt.headers||{})}});
  if(r.status===404) return null;
  if(!r.ok) throw new Error('GitHub '+r.status+' — '+(await r.text()).slice(0,140));
  return r.json();
}
async function removeLocal(id){
  try{ await caches.delete('songs-'+id); }catch(e){}
  localStorage.setItem('localSongs', JSON.stringify(
    JSON.parse(localStorage.getItem('localSongs')||'[]').filter(s=>s.id!==id)));
}
async function removePublished(id, say){
  const c=ghCfg();
  if(!c.repo||!c.token){
    alert(T('del.needgh'));
    location.href='add.html'; return false;
  }
  const branch=c.branch||'main';
  const files=await ghApi('/contents/songs/'+id+'?ref='+branch);
  if(Array.isArray(files)){
    let i=0;
    for(const f of files){
      say('del.progress',{i:++i,n:files.length,name:f.name});
      await ghApi('/contents/'+f.path, {method:'DELETE',
        body:JSON.stringify({message:'remove '+f.path, sha:f.sha, branch})});
    }
  }
  say('del.updating');
  const cur=await ghApi('/contents/songs/index.json?ref='+branch);
  if(cur&&cur.content){
    let idx={songs:[]};
    try{ idx=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(cur.content.replace(/\n/g,'')),ch=>ch.charCodeAt(0)))); }catch(e){}
    idx.songs=(idx.songs||[]).filter(s=>s.id!==id);
    const body=btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(idx,null,2))));
    await ghApi('/contents/songs/index.json', {method:'PUT',
      body:JSON.stringify({message:'remove '+id+' from list', content:body, sha:cur.sha, branch})});
  }
  await removeLocal(id);
  return true;
}
document.getElementById('list').addEventListener('click', async e=>{
  const fix=e.target.closest('[data-fix]'), del=e.target.closest('[data-del]');
  if(!fix&&!del) return;
  e.preventDefault(); e.stopPropagation();

  if(fix){
    if(!owner) return;
    sessionStorage.setItem('redoSong', fix.dataset.fix);
    location.href='add.html?redo='+encodeURIComponent(fix.dataset.fix);
    return;
  }

  const id=del.dataset.del, s=songs.find(x=>x.id===id)||{};
  if(busy.has(id)) return;                     // 이미 삭제 중
  const say=(key,vars)=>{ busy.set(id,[key,vars]); const b=[...document.querySelectorAll('[data-del]')].find(x=>x.dataset.del===id); if(b) b.textContent=busyText(id); };
  if(!s.local&&!owner) return;                 // 공개된 곡은 관리자만
  if(!confirm(s.local?T('del.confirm.local',{title:s.title}):T('del.confirm.pub',{title:s.title}))) return;
  del.disabled=true; busy.set(id,['del.btn']);   // 로컬·공개 모두 끝날 때까지 잠근다(언어를 바꿔 다시 그려도 유지)
  let ok=false;
  try{
    if(s.local){ await removeLocal(id); ok=true; }
    else ok=!!(await removePublished(id, say));
  }catch(err){ alert(T('del.fail',{msg:err.message})); }
  finally{ busy.delete(id); }
  if(ok){ songs=songs.filter(x=>x.id!==id); cached.delete(id); }
  render();
});
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
