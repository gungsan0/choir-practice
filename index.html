<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>울림 합창 연습실</title>
<meta name="description" content="악보를 따라가며 파트별로 연습하는 합창 연습 앱">
<meta name="theme-color" content="#15181d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="top"><div class="inner"><div class="brand">
  <img src="logo-badge.png" width="46" height="46" alt="울림 어린이합창단">
  <div><h1>울림 합창 연습실</h1><p>악보를 따라가며 파트별로 연습하세요</p></div>
</div></div></div>

<div class="wrap">
  <div class="toolbar">
    <input class="search" id="q" type="search" placeholder="곡 검색" autocomplete="off">
    <a class="add" href="add.html">＋ 곡 추가</a>
  </div>
  <div class="list" id="list"></div>
  <div class="note" id="note"></div>
</div>

<script>
const COLORS=["#e0483c","#1f9d55","#2f6fe0","#8b5cf6","#e08a1e","#0d9488","#d6336c","#4b5563"];
const fmt=s=>Math.floor(s/60)+'분 '+String(Math.round(s%60)).padStart(2,'0')+'초';
let songs=[], cached=new Set();

async function cachedIds(){
  if(!('caches' in window)) return new Set();
  try{
    const keys=await caches.keys(); const out=new Set();
    for(const k of keys){
      if(!k.startsWith('songs-')) continue;
      const c=await caches.open(k);
      for(const r of await c.keys()){
        const m=r.url.match(/songs\/([^/]+)\//); if(m) out.add(m[1]);
      }
    }
    return out;
  }catch(e){ return new Set(); }
}

function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const list=document.getElementById('list');
  const rows=songs.filter(s=>!q||(s.title+' '+(s.subtitle||'')+' '+(s.parts||[]).join(' ')).toLowerCase().includes(q));
  list.innerHTML='';
  if(!rows.length){
    list.innerHTML='<div class="empty">'+(songs.length
      ? '검색 결과가 없습니다.'
      : '아직 등록된 곡이 없습니다.<br><b>＋ 곡 추가</b> 를 눌러 악보 PDF와 파트별 음원을 올려보세요.')+'</div>';
    return;
  }
  rows.forEach(s=>{
    const a=document.createElement('a');
    a.className='card'; a.href='player.html?song='+encodeURIComponent(s.id);
    const chips=(s.parts||[]).map((p,i)=>`<span class="chip" style="background:${COLORS[i%COLORS.length]}">${p}</span>`).join('');
    a.innerHTML=`<h2>${s.title}</h2>`+(s.subtitle?`<p class="sub">${s.subtitle}</p>`:'')+
      `<div class="chips">${chips}
        ${s.local?'<span class="saved">● 이 기기에 추가함</span>':(cached.has(s.id)?'<span class="saved">● 오프라인 저장됨</span>':'')}
        <span class="meta">${s.measures?s.measures+'마디 · ':''}${s.pages?s.pages+'쪽 · ':''}${s.duration?fmt(s.duration):''}</span>
        ${s.local?`<button class="del" title="이 기기에서 삭제" data-del="${s.id}">×</button>`:''}
      </div>`;
    list.appendChild(a);
  });
}

(async ()=>{
  try{
    const r=await fetch('songs/index.json',{cache:'no-cache'});
    songs=(await r.json()).songs||[];
  }catch(e){ songs=[]; }
  try{
    const local=JSON.parse(localStorage.getItem('localSongs')||'[]');
    const ids=new Set(songs.map(s=>s.id));
    songs=songs.concat(local.filter(s=>!ids.has(s.id)));
    songs.sort((a,b)=>a.title.localeCompare(b.title));
  }catch(e){}
  cached=await cachedIds();
  render();
  document.getElementById('note').innerHTML =
    '<b>＋ 곡 추가</b>에서 악보 PDF와 파트별 음원을 올리면 앱이 마디를 찾아 자동으로 맞춰줍니다. ' +
    '곡 하나를 열어 <b>오프라인 저장</b>을 누르면 인터넷 없이도 연습할 수 있어요. ' +
    '휴대폰에서는 공유 → 홈 화면에 추가하면 앱처럼 열립니다.';
})();
document.getElementById('q').addEventListener('input',render);
document.getElementById('list').addEventListener('click', async e=>{
  const b=e.target.closest('[data-del]'); if(!b) return;
  e.preventDefault(); e.stopPropagation();
  const id=b.dataset.del;
  if(!confirm('이 기기에서 이 곡을 삭제할까요? (앱에 공개된 곡은 지워지지 않습니다)')) return;
  try{ await caches.delete('songs-'+id); }catch(err){}
  localStorage.setItem('localSongs', JSON.stringify(JSON.parse(localStorage.getItem('localSongs')||'[]').filter(s=>s.id!==id)));
  songs=songs.filter(s=>s.id!==id); render();
});
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
