<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>울림 합창 연습실</title>
<meta name="description" content="악보를 따라가며 파트별로 연습하는 합창 연습 앱">
<meta name="theme-color" content="#15181d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="top"><div class="inner"><div class="brand">
  <img src="logo-badge.png" width="46" height="46" alt="울림 어린이합창단">
  <div><h1>울림 합창 연습실</h1><p>악보를 따라가며 파트별로 연습하세요</p></div>
</div></div></div>

<div class="wrap">
  <div class="toolbar">
    <input class="search" id="q" type="search" placeholder="곡 검색" autocomplete="off">
    <a class="add" href="add.html">＋ 곡 추가</a>
  </div>
  <div class="list" id="list"></div>
  <div class="note" id="note"></div>
</div>

<script>
const COLORS=["#e0483c","#1f9d55","#2f6fe0","#8b5cf6","#e08a1e","#0d9488","#d6336c","#4b5563"];
const fmt=s=>Math.floor(s/60)+'분 '+String(Math.round(s%60)).padStart(2,'0')+'초';
let songs=[], cached=new Set();

async function cachedIds(){
  if(!('caches' in window)) return new Set();
  try{
    const keys=await caches.keys(); const out=new Set();
    for(const k of keys){
      if(!k.startsWith('songs-')) continue;
      const c=await caches.open(k);
      for(const r of await c.keys()){
        const m=r.url.match(/songs\/([^/]+)\//); if(m) out.add(m[1]);
      }
    }
    return out;
  }catch(e){ return new Set(); }
}

function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const list=document.getElementById('list');
  const rows=songs.filter(s=>!q||(s.title+' '+(s.subtitle||'')+' '+(s.parts||[]).join(' ')).toLowerCase().includes(q));
  list.innerHTML='';
  if(!rows.length){
    list.innerHTML='<div class="empty">'+(songs.length
      ? '검색 결과가 없습니다.'
      : '아직 등록된 곡이 없습니다.<br><b>＋ 곡 추가</b> 를 눌러 악보 PDF와 파트별 음원을 올려보세요.')+'</div>';
    return;
  }
  rows.forEach(s=>{
    const a=document.createElement('a');
    a.className='card'; a.href='player.html?song='+encodeURIComponent(s.id);
    const chips=(s.parts||[]).map((p,i)=>`<span class="chip" style="background:${COLORS[i%COLORS.length]}">${p}</span>`).join('')
      +(s.accomp?`<span class="chip" style="background:#6b7280">🎹 ${s.accomp}</span>`:'');
    a.innerHTML=`<h2>${s.title}</h2>`+(s.subtitle?`<p class="sub">${s.subtitle}</p>`:'')+
      `<div class="chips">${chips}
        ${s.local?'<span class="saved">● 이 기기에 추가함</span>':(cached.has(s.id)?'<span class="saved">● 오프라인 저장됨</span>':'')}
        <span class="meta">${s.measures?s.measures+'마디 · ':''}${s.pages?s.pages+'쪽 · ':''}${s.duration?fmt(s.duration):''}</span>
        <button class="del" data-fix="${s.id}" title="악보 인식을 다시 해서 이 곡을 덮어씁니다">다시 만들기</button>
        <button class="del danger" data-del="${s.id}" title="${s.local?'이 기기에서 삭제':'모두에게서 삭제 (GitHub)'}">삭제</button>
      </div>`;
    list.appendChild(a);
  });
}

(async ()=>{
  try{
    const r=await fetch('songs/index.json',{cache:'no-cache'});
    songs=(await r.json()).songs||[];
  }catch(e){ songs=[]; }
  try{
    const local=JSON.parse(localStorage.getItem('localSongs')||'[]');
    const ids=new Set(songs.map(s=>s.id));
    songs=songs.concat(local.filter(s=>!ids.has(s.id)));
    songs.sort((a,b)=>a.title.localeCompare(b.title));
  }catch(e){}
  cached=await cachedIds();
  render();
  document.getElementById('note').innerHTML =
    '<b>＋ 곡 추가</b>에서 악보 PDF와 파트별 음원을 올리면 앱이 마디를 찾아 자동으로 맞춰줍니다. ' +
    '곡 하나를 열어 <b>오프라인 저장</b>을 누르면 인터넷 없이도 연습할 수 있어요. ' +
    '휴대폰에서는 공유 → 홈 화면에 추가하면 앱처럼 열립니다.' +
    ' <span style="opacity:.7">앱 버전 2026.08.15-a</span> · <a href="#" id="hard" style="text-decoration:underline">앱 새로고침</a>';
  document.getElementById('hard').onclick = async e => {
    e.preventDefault();
    try {
      const rs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(r => r.unregister()));
      const keys = await caches.keys();
      await Promise.all(keys.filter(k => k.startsWith('shell-')).map(k => caches.delete(k)));
    } catch (err) {}
    location.reload(true);
  };
})();
document.getElementById('q').addEventListener('input',render);
/* ── 곡 삭제 / 다시 만들기 ─────────────────────────── */
const ghCfg = () => { try{ return JSON.parse(localStorage.getItem('gh')||'{}'); }catch(e){ return {}; } };
async function ghApi(path, opt={}){
  const c=ghCfg();
  const r=await fetch('https://api.github.com/repos/'+c.repo+path, {...opt,
    headers:{Authorization:'Bearer '+c.token, Accept:'application/vnd.github+json', ...(opt.headers||{})}});
  if(r.status===404) return null;
  if(!r.ok) throw new Error('GitHub '+r.status+' — '+(await r.text()).slice(0,140));
  return r.json();
}
async function removeLocal(id){
  try{ await caches.delete('songs-'+id); }catch(e){}
  localStorage.setItem('localSongs', JSON.stringify(
    JSON.parse(localStorage.getItem('localSongs')||'[]').filter(s=>s.id!==id)));
}
async function removePublished(id, say){
  const c=ghCfg();
  if(!c.repo||!c.token){
    alert('공개된 곡을 지우려면 GitHub 연결이 필요합니다.\n＋ 곡 추가 → GitHub 연결 설정에서 저장소와 토큰을 먼저 입력해주세요.');
    location.href='add.html'; return false;
  }
  const branch=c.branch||'main';
  const files=await ghApi('/contents/songs/'+id+'?ref='+branch);
  if(Array.isArray(files)){
    let i=0;
    for(const f of files){
      say(`삭제 중… (${++i}/${files.length}) ${f.name}`);
      await ghApi('/contents/'+f.path, {method:'DELETE',
        body:JSON.stringify({message:'remove '+f.path, sha:f.sha, branch})});
    }
  }
  say('곡 목록 갱신 중…');
  const cur=await ghApi('/contents/songs/index.json?ref='+branch);
  if(cur&&cur.content){
    let idx={songs:[]};
    try{ idx=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(cur.content.replace(/\n/g,'')),ch=>ch.charCodeAt(0)))); }catch(e){}
    idx.songs=(idx.songs||[]).filter(s=>s.id!==id);
    const body=btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(idx,null,2))));
    await ghApi('/contents/songs/index.json', {method:'PUT',
      body:JSON.stringify({message:'remove '+id+' from list', content:body, sha:cur.sha, branch})});
  }
  await removeLocal(id);
  return true;
}
document.getElementById('list').addEventListener('click', async e=>{
  const fix=e.target.closest('[data-fix]'), del=e.target.closest('[data-del]');
  if(!fix&&!del) return;
  e.preventDefault(); e.stopPropagation();

  if(fix){
    sessionStorage.setItem('redoSong', fix.dataset.fix);
    location.href='add.html?redo='+encodeURIComponent(fix.dataset.fix);
    return;
  }

  const id=del.dataset.del, s=songs.find(x=>x.id===id)||{};
  const say=t=>{ del.textContent=t; };
  if(s.local){
    if(!confirm(`"${s.title}" 을(를) 이 기기에서 삭제할까요?`)) return;
    await removeLocal(id);
  }else{
    if(!confirm(`"${s.title}" 을(를) GitHub에서 완전히 삭제할까요?\n모든 사람의 목록에서 사라집니다. (1~2분 뒤 반영)`)) return;
    del.disabled=true;
    try{ if(!await removePublished(id, say)) return; }
    catch(err){ alert('삭제 실패: '+err.message); del.disabled=false; del.textContent='삭제'; return; }
  }
  songs=songs.filter(x=>x.id!==id);
  cached.delete(id);
  render();
});
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
